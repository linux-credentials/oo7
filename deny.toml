[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu"
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0", # rpassword by cli only
  "BSD-3-Clause", # used by subtle -> digest
  "Unicode-3.0", # used by icu_collections -> url
  "Apache-2.0 WITH LLVM-exception", # target-lexicon -> pyo3
]

[sources]
allow-git = [
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# oo7 <-> oo7-daemon have a circular dev-dependency that can't carry a version
allow-wildcard-paths = true
highlight = "all"
skip = [
    { name = "syn" },
]
