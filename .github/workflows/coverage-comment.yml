name: Post Coverage Comment

on:
  workflow_run:
    workflows: ["Code Coverage"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    name: Post Coverage Comment on PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download coverage comment data
        uses: actions/download-artifact@v8
        with:
          name: coverage-comment
          path: coverage-comment/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post coverage comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(fs.readFileSync('coverage-comment/pr-number.txt', 'utf8').trim());
            const prCoverage = parseFloat(fs.readFileSync('coverage-comment/pr-coverage.txt', 'utf8').trim());
            const mainCoverage = parseFloat(fs.readFileSync('coverage-comment/main-coverage.txt', 'utf8').trim());

            const diff = prCoverage - mainCoverage;
            const diffText = diff > 0 ? `+${diff.toFixed(2)}%` : `${diff.toFixed(2)}%`;
            const emoji = diff > 0 ? '📈' : diff < 0 ? '📉' : '➡️';

            const body = `## 📊 Code Coverage Report

            | Metric | Value |
            |--------|-------|
            | **Current PR Coverage** | ${prCoverage.toFixed(2)}% |
            | **Main Branch Coverage** | ${mainCoverage.toFixed(2)}% |
            | **Coverage Change** | ${emoji} ${diffText} |

            ${diff < -1 ? '⚠️ **Warning**: Coverage decreased by more than 1%' : ''}
            ${diff > 1 ? '🎉 **Great**: Coverage increased by more than 1%!' : ''}

            *Coverage report generated by [cargo-tarpaulin](https://github.com/xd009642/tarpaulin)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes('## 📊 Code Coverage Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
